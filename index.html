<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Threads | REBEL Collection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Dancing+Script:wght@700&family=Roboto:wght@400;700&display=swap');

        body {
            background-color: #121212;
            background-image: radial-gradient(circle, #2a2a2a 1px, transparent 1px);
            background-size: 20px 20px;
            color: #f4f4f0;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        /* Fixed container specifically for the rain to prevent scroll glitches */
        #rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0; /* Stays at the very back */
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            padding: 50px 30px;
            background: transparent; /* Made transparent so rain shows behind text */
            border: 3px solid #333;
            box-shadow: 12px 12px 0px #cc0000;
            position: relative;
            z-index: 10; /* Keeps content above the rain */
        }

        .logo img {
            max-width: 250px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Anton', sans-serif;
            font-size: 6rem;
            color: #cc0000;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            line-height: 1;
            text-shadow: 2px 2px 0px #000;
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #d1cbbd;
            margin-top: -25px;
            margin-bottom: 30px;
            transform: rotate(-3deg);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #a0a0a0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        input {
            padding: 15px;
            font-size: 1rem;
            border: 2px solid #444;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #cc0000;
        }

        button {
            padding: 18px;
            font-size: 1.2rem;
            font-family: 'Anton', sans-serif;
            color: #fff;
            background-color: #cc0000;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #ff1a1a;
            transform: translateY(-4px);
        }
        
        /* Heavy Metal / Gothic Background Animation */
        .gothic-bg {
            position: absolute;
            top: -50px; 
            color: #cc0000;
            font-family: 'Times New Roman', serif;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #990000;
            animation: metalRain linear forwards;
        }

        @keyframes metalRain {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
            25% { transform: translate(-20px, 30vh) rotate(15deg); opacity: 0.7; }
            50% { transform: translate(20px, 60vh) rotate(-20deg); opacity: 0.3; }
            75% { transform: translate(-10px, 90vh) rotate(10deg); opacity: 0.6; }
            100% { transform: translate(10px, 120vh) rotate(0deg); opacity: 0.4; }
        }
    </style>
</head>
<body>

    <!-- This container locks the rain to the back of your screen -->
    <div id="rain-container"></div>

    <div class="container">
        <div class="logo">
            <img src="LOGO.png" alt="Urban Threads Logo">
        </div>
        
        <h1>REBEL</h1>
        <div class="subtitle">Refuse to be Ordinary</div>
        <p>Back to School Streetwear Collection<br><br>Limited Stocks Only!</p>
        
        <form onsubmit="event.preventDefault(); window.location.href='home.html';">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <button type="submit">Shop the Back-to-School Collection now!</button>
        </form>
    </div>

    <script>
        // Generate Heavy Metal Gothic Background
        function createHeavyMetalBg() {
            const symbols = ['⸸', '⛧', '×', '☠'];
            const gothicElement = document.createElement('div');
            gothicElement.className = 'gothic-bg';
            
            gothicElement.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            
            gothicElement.style.left = Math.random() * 96 + 2 + '%';
            
            const duration = Math.random() * 6 + 6; 
            gothicElement.style.animationDuration = duration + 's';
            
            // Generate smaller symbols to pass subtly behind text
            gothicElement.style.fontSize = (Math.random() * 30 + 25) + 'px';
            
            // Append directly to the fixed rain window at the back
            document.getElementById('rain-container').appendChild(gothicElement);
            
            setTimeout(() => gothicElement.remove(), duration * 1000);
        }
        
        setInterval(createHeavyMetalBg, 250);
    </script>
</body>
</html>
